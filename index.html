/* =========================================================================
   ★★★ 매일 교체하는 부분 — 코드별 당일 진도 실적 ★★★
   -------------------------------------------------------------------------
   엑셀 컬럼과 1:1로 맞춰져 있습니다.

     코드 : { bial, bridge, etc, hcMultiple, name }

       bial        비암치 실적              → 시상 1
       bridge      브릿지 실적 (하이캡 17↑)  → 시상 2
       etc         기타 인보험 실적          → 위 둘에 해당하지 않는 인보험
       hcMultiple  현재 하이캡 배수 (소수 첫째자리까지 · 예 15.4)
       name        이름 (없으면 코드만 표시 · 선택 항목)

   ※ 합산 인보험 실적 = bial + bridge + etc 로 자동 계산합니다.
   ========================================================================= */

/* 실제 배포(빌드)가 일어난 순간에만 값이 생기는 자동 타임스탬프.
   GitHub Actions가 데이터를 실제로 반영해 사이트를 새로 만들 때만 찍히고,
   그 사이에는(예: 자정이 지나도) 저절로 바뀌지 않습니다.
   미리보기 화면이나 npm run dev에서는 빈 값이 정상이에요. */
const LAST_UPDATED = "8월 20일 14:00"; // 이 파일을 새로 만들 때마다 그 시각으로 고정됩니다

};

/* =========================================================================

const HC20 = 20;
const HC20T = "20.0";
const HC17 = 17;
const HC17T = "17.0";
const BRIDGE_PERIOD = "2026.08.15 ~ 08.31"; // 브릿지만 시상 기간이 다름 (나머지는 DAILY_DATA.awardPeriodLabel)

const AWARD_RULES = {
  bial: {
    scope: "비급여주요암치료비 플랜 계약만 인정",
    tiers: [
      { id: "t1", threshold: 20000, reward: 20000, label: "2만원" },
      { id: "t2", threshold: 50000, reward: 50000, label: "5만원" },
      { id: "t3", threshold: 100000, reward: 100000, label: "10만원" },
    ],
  },
  bridge: {
    scope: `하이캡 배수 ${HC17T} 이상 계약만 인정`,
    tiers: [
      { threshold: 100000, challenge: 500000, label: "10만원" },
      { threshold: 200000, challenge: 1000000, label: "20만원" },
      { threshold: 300000, challenge: 1500000, label: "30만원" },
    ],
    nextMonthMin: 100000,
    nextMonthWindow: "익월 1~2주차",
  },
  insuranceBase: {
    scope: "인보험 실적 전체 합산",
    tiers: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 1000000],
    baseRate: 0.6,
    highRate: 1.0,
  },
  gift: {
    scope: "인보험 실적 전체 합산 · 해당 구간 하나만 선택 (중복 아님)",
    tiers: [
      { threshold: 100000, label: "10만원", options: ["홍삼활기력 세트", "골드바 0.1g"] },
      { threshold: 200000, label: "20만원", options: ["에어프라이어", "골드바 0.2g"] },
      { threshold: 300000, label: "30만원", options: ["테팔 무선청소기", "골드바 0.3g"] },
    ],
  },
};

function calcBial(bial) {
  const tiers = AWARD_RULES.bial.tiers;
  let achieved = null, idx = -1;
  for (let i = tiers.length - 1; i >= 0; i--) {
    if (bial >= tiers[i].threshold) { achieved = tiers[i]; idx = i; break; }
  }
  const next = tiers[idx + 1] || null;
  return { reward: achieved ? achieved.reward : 0, achievedTier: achieved, nextTier: next, remainingToNext: next ? Math.max(0, next.threshold - bial) : 0 };
}

function calcInsuranceBase(insurance, isHigh) {
  const { tiers, baseRate, highRate } = AWARD_RULES.insuranceBase;
  const rate = isHigh ? highRate : baseRate;
  let tier = null, idx = -1;
  for (let i = tiers.length - 1; i >= 0; i--) {
    if (insurance >= tiers[i]) { tier = tiers[i]; idx = i; break; }
  }
  const nextTier = tiers[idx + 1] || null;
  return { rate, tier, total: tier ? tier * rate : 0, nextTier, remainingToNext: nextTier ? Math.max(0, nextTier - insurance) : 0 };
}

function calcBridge(bridge) {
  const { tiers } = AWARD_RULES.bridge;
  let achieved = null, idx = -1;
  for (let i = tiers.length - 1; i >= 0; i--) {
    if (bridge >= tiers[i].threshold) { achieved = tiers[i]; idx = i; break; }
  }
  const next = achieved ? tiers[idx + 1] || null : tiers[0];
  return { eligible: !!achieved, achievedTier: achieved, nextTier: next, remaining: next ? Math.max(0, next.threshold - bridge) : 0 };
}

/* 사은품은 중복 시상이 아님 — 본인이 해당하는 구간 하나만 */
function calcGift(insurance) {
  const tiers = AWARD_RULES.gift.tiers;
  let tier = null, idx = -1;
  for (let i = tiers.length - 1; i >= 0; i--) {
    if (insurance >= tiers[i].threshold) { tier = tiers[i]; idx = i; break; }
  }
  const nextTier = tiers[idx + 1] || null;
  return { tier, nextTier, remainingToNext: nextTier ? Math.max(0, nextTier.threshold - insurance) : 0 };
}

function calculateAward({ insurance, bial, bridge, isHigh }) {
  const b = calcBial(bial);
  const ib = calcInsuranceBase(insurance, isHigh);
  const br = calcBridge(bridge);
  const g = calcGift(insurance);
  return { bial: b, insuranceBase: ib, bridge: br, gift: g, cash: b.reward + ib.total };
}

function BreakdownRow({ title, value, muted }) {

        <span className="flex items-center gap-1.5" style={{ minWidth: 0 }}>
          <span style={{ fontSize: f(15.5), fontWeight: 900, color: C.orange500, whiteSpace: "nowrap" }}>{value}</span>

        <span style={{ fontSize: f(14), fontWeight: 700, color: "rgba(255,255,255,0.35)" }}>미달성</span>
      )}

  );
}

/* 결과 카드 안 — 금액 외에 올라가는 항목 강조 */
function UnlockRow({ title, before, after, positive, icon }) {
  const f = useF();
  return (
    <div
      className="flex items-center gap-2.5 rounded-2xl"

        padding: `${f(12)}px ${f(14)}px`,

}

function RuleBlock({ title, items, note }) {
  const f = useF();
  return (
    <div style={{ marginBottom: f(18) }}>
      <p style={{ fontSize: f(16), fontWeight: 900, color: C.orange700 }}>{title}</p>
      <ul style={{ marginTop: f(6) }}>

        </div>
      )}

}

function GyeonginiApp() {
  const [bigText, setBigText] = useState(false);

  const [code, setCode] = useState("");
  const [lookup, setLookup] = useState({ status: "idle", planner: null });

  const [addBialStr, setAddBialStr] = useState("");
  const [addBridgeStr, setAddBridgeStr] = useState("");
  const [addEtcStr, setAddEtcStr] = useState("");
  const [simHigh, setSimHigh] = useState(false);
  const [giftPick, setGiftPick] = useState(null);
  const [rulesOpen, setRulesOpen] = useState(false);

  const p = lookup.planner;
  const addBial = num(addBialStr);
  const addBridge = num(addBridgeStr);
  const addEtc = num(addEtcStr);
  const addTotal = addBial + addBridge + addEtc;
  const realHigh = p ? p.hcMultiple >= HC20 : false;
  const hcText = p ? Number(p.hcMultiple).toFixed(1) : "";

  const current = useMemo(
    () => (p ? calculateAward({ insurance: p.insurance, bial: p.bial, bridge: p.bridge, isHigh: realHigh }) : null),
    [p, realHigh]
  );

  const after = useMemo(
    () =>
      p
        ? calculateAward({
            insurance: p.insurance + addTotal,
            bial: p.bial + addBial,
            bridge: p.bridge + addBridge,
            isHigh: realHigh || simHigh,
          })
        : null,
    [p, addTotal, addBial, addBridge, realHigh, simHigh]
  );

  const highOnlyGain = useMemo(() => {
    if (!p || realHigh) return 0;
    const h = calculateAward({ insurance: p.insurance, bial: p.bial, bridge: p.bridge, isHigh: true });
    return h.cash - current.cash;
  }, [p, realHigh, current]);

  const suggestions = useMemo(() => {
    if (!p) return [];
    const list = [];
    const ib = current.insuranceBase;
    if (ib.nextTier) list.push({ amount: ib.remainingToNext, label: `인보험 ${man(ib.nextTier)}만원 구간`, field: "etc" });
    const bi = current.bial;
    if (bi.nextTier) list.push({ amount: bi.remainingToNext, label: `비암치 ${bi.nextTier.label} 구간`, field: "bial" });
    const gi = current.gift;
    if (gi.nextTier) list.push({ amount: gi.remainingToNext, label: `사은품 ${gi.nextTier.label} 구간`, field: "etc" });
    const br = current.bridge;
    if (br.nextTier) list.push({ amount: br.remaining, label: `브릿지 ${man(br.nextTier.challenge)}만원 도전권`, field: "bridge" });
    return list.filter((x) => x.amount > 0).sort((a, b) => a.amount - b.amount);
  }, [p, current]);

  const clearInputs = () => {
    setAddBialStr("");
    setAddBridgeStr("");
    setAddEtcStr("");
    setSimHigh(false);
  };

  const handleSearch = () => {
    const key = code.trim().toUpperCase();
    if (!key) return;
    const found = DAILY_DATA.planners[key];
    setLookup(
      found
        ? { status: "found", planner: { ...found, code: key, insurance: (found.bial || 0) + (found.bridge || 0) + (found.etc || 0) } }
        : { status: "notfound", planner: null }
    );
    clearInputs();
    setGiftPick(null);
  };

  const reset = () => {
    setLookup({ status: "idle", planner: null });
    setCode("");
    clearInputs();
    setGiftPick(null);
  };

  const applySuggestion = (s) => {
    if (s.field === "bial") setAddBialStr(String(s.amount));
    else if (s.field === "bridge") setAddBridgeStr(String(s.amount));
    else setAddEtcStr(String(s.amount));
  };

  const rateUp = !!p && !realHigh && simHigh;
  const showResult = !!p && (addTotal > 0 || rateUp);
  const cashDelta = after && current ? after.cash - current.cash : 0;
  const bridgeBefore = current?.bridge.achievedTier?.challenge || 0;
  const bridgeAfter = after?.bridge.achievedTier?.challenge || 0;
  const giftBefore = current?.gift.tier;
  const giftAfter = after?.gift.tier; /* 실제로 받게 되는 구간 — 이 구간만 선택 가능 */
  const giftChanged = (giftBefore?.threshold || 0) !== (giftAfter?.threshold || 0);
  const positive = cashDelta > 0;

                  <div style={{ marginTop: f(18), paddingTop: f(16), borderTop: `1px solid ${C.line}` }}>
                    <Label>내 하이캡 배수</Label>
                    <Note style={{ marginTop: f(4), marginBottom: f(10) }}>{HC20T}배수 이상이면 인보험 기본시상을 60%가 아니라 100% 받아요</Note>
                    {realHigh ? (
                      <div className="rounded-2xl flex items-center gap-2" style={{ padding: f(14), background: C.orange50, border: `2px solid ${C.orange200}` }}>
                        <CheckCircle2 size={f(22)} color={C.orange600} />
                        <span style={{ fontSize: f(16), fontWeight: 800, color: C.orange700 }}>지금 {hcText}배수 · 100% 지급 대상이에요</span>
                      </div>
                    ) : (
                      <>
                        <div className="flex gap-2" style={{ minWidth: 0 }}>
                          <BigButton active={!simHigh} onClick={() => setSimHigh(false)} style={{ flex: 1 }}>지금 {hcText}배수<br />60% 지급</BigButton>
                          <BigButton active={simHigh} onClick={() => setSimHigh(true)} style={{ flex: 1 }}>{HC20T}배수 이상<br />100% 지급</BigButton>
                        </div>
                        {highOnlyGain > 0 && !simHigh && (
                          <button
                            type="button"
                            onClick={() => setSimHigh(true)}
                            className="w-full flex items-center gap-2 rounded-2xl active:scale-[0.99] transition-transform"
                            style={{ marginTop: f(10), padding: f(14), minHeight: f(56), background: C.teal100, border: "2px solid #B7E5E1", textAlign: "left", minWidth: 0 }}
                          >
                            <TrendingUp size={f(20)} color={C.teal700} style={{ flexShrink: 0 }} />
                            <span style={{ fontSize: f(15), fontWeight: 800, color: C.teal700 }}>
                              실적 그대로 {HC20T}배수만 되면 <span style={{ fontSize: f(16.5), fontWeight: 900 }}>+{fmt(highOnlyGain)}원</span>
                            </span>
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </Card>

                {/* 결과 */}
                <div
                  className="rounded-3xl"
                  style={{
                    marginTop: f(14),
                    padding: f(20),
                    background: showResult && positive ? `linear-gradient(150deg, ${C.orange600} 0%, ${C.orange700} 100%)` : "#fff",
                    border: showResult && positive ? "none" : `2px dashed ${C.orange200}`,
                    boxShadow: showResult && positive ? "0 10px 26px rgba(201,68,0,0.3)" : "none",
                  }}
                >
                  {!showResult ? (
                    <div className="flex items-center gap-3" style={{ minWidth: 0 }}>
                      <MascotCoin size={f(52)} />
                      <p style={{ fontSize: f(16), fontWeight: 800, color: C.inkMid, lineHeight: 1.6 }}>
                        위에 금액을 넣어 보세요.<br />얼마를 더 받는지 여기에 나와요.
                      </p>
                    </div>
                  ) : (
                    <>
                      <div className="flex items-center gap-2" style={{ minWidth: 0 }}>
                        <MascotCoin size={f(46)} />
                        <p style={{ fontSize: f(15.5), fontWeight: 800, color: positive ? "rgba(255,255,255,0.95)" : C.inkMid }}>{lead}</p>
                      </div>
                      <p style={{ marginTop: f(8), fontSize: f(42), fontWeight: 900, color: positive ? "#fff" : C.ink, fontFeatureSettings: '"tnum"', letterSpacing: "-1px", lineHeight: 1.1 }}>
                        {positive ? "+" : ""}{fmt(cashDelta)}<span style={{ fontSize: f(20), fontWeight: 800 }}> 원</span>
                      </p>
                      <p style={{ fontSize: f(16), fontWeight: 800, color: positive ? "rgba(255,255,255,0.95)" : C.inkMid, marginTop: 2 }}>
                        {positive ? "시상금을 더 받아요!" : "아직 시상금 변화는 없어요"}
                      </p>

                      <div className="flex items-center gap-2 rounded-2xl flex-wrap" style={{ marginTop: f(14), padding: f(13), background: positive ? "rgba(255,255,255,0.2)" : "#FAF6F1" }}>
                        <span style={{ fontSize: f(16.5), fontWeight: 800, color: positive ? "rgba(255,255,255,0.88)" : C.inkSoft, fontFeatureSettings: '"tnum"' }}>{fmt(current.cash)}원</span>
                        <ArrowRight size={f(18)} color={positive ? "#fff" : C.inkSoft} />
                        <span style={{ fontSize: f(20), fontWeight: 900, color: positive ? "#fff" : C.ink, fontFeatureSettings: '"tnum"' }}>{fmt(after.cash)}원</span>
                      </div>

                      {(giftChanged || bridgeAfter > bridgeBefore || rateUp) && (
                        <div style={{ marginTop: f(12) }}>
                          <p style={{ fontSize: f(14.5), fontWeight: 900, color: positive ? "rgba(255,255,255,0.9)" : C.inkMid, marginBottom: f(8) }}>돈 말고 이것도 같이 올라가요</p>
                          <div className="flex flex-col gap-2">
                            {giftChanged && (
                              <UnlockRow
                                icon={<MascotGift size={f(34)} />}
                                title="사은품 구간"
                                before={giftBefore ? `${giftBefore.label} 구간` : "미달성"}
                                after={giftAfter ? `${giftAfter.label} 구간` : "미달성"}
                                positive={positive}
                              />
                            )}
                            {bridgeAfter > bridgeBefore && (
                              <UnlockRow
                                title="브릿지 도전권"
                                before={bridgeBefore ? `${man(bridgeBefore)}만원` : "없음"}
                                after={`${man(bridgeAfter)}만원`}
                                positive={positive}
                              />
                            )}
                            {rateUp && (
                              <UnlockRow title="인보험 지급률" before="60%" after="100%" positive={positive} />
                            )}
                          </div>
                        </div>
                      )}
                    </>
                  )}
                </div>

                {showResult && (
                  <Card style={{ marginTop: f(14) }}>
                    <Label style={{ marginBottom: f(12) }}>어느 시상에서 늘어나나요</Label>
                    <div className="flex flex-col gap-2">
                      <ChangeRow title="1. 비암치 추가시상" before={current.bial.reward} after={after.bial.reward} delta={after.bial.reward - current.bial.reward} />
                      <ChangeRow title="3. 인보험 기본시상" before={current.insuranceBase.total} after={after.insuranceBase.total} delta={after.insuranceBase.total - current.insuranceBase.total} />
                      <ChangeRow title="2. 브릿지 도전권" before={bridgeBefore} after={bridgeAfter} delta={bridgeAfter - bridgeBefore} tone="teal" />
                      <TextChangeRow
                        title="4. 사은품 구간"
                        before={giftBefore ? `${giftBefore.label} 구간` : "미달성"}
                        after={giftAfter ? `${giftAfter.label} 구간` : "미달성"}
                        changed={giftChanged}
                      />
                    </div>
                    <Note style={{ marginTop: f(12) }}>시상 1·2·3은 중복으로 받을 수 있어요. 사은품은 해당하는 한 구간에서만 고를 수 있고, 브릿지는 현금이 아니라 익월 도전권이라 합계에는 빠져 있어요.</Note>
                  </Card>
                )}

                {/* 사은품 — 본인 구간만 활성화 */}
                <Card style={{ marginTop: f(14) }}>
                  <Speech mascot={<MascotGift size={f(44)} />} tone="cream">
                    {giftAfter
                      ? `지금은 ${giftAfter.label} 구간이에요. 이 구간에서 하나만 고를 수 있어요!`
                      : "아직 사은품 구간에 못 미쳤어요. 10만원부터 시작해요!"}
                  </Speech>
                  <div className="flex flex-col gap-2" style={{ marginTop: f(14) }}>
                    {AWARD_RULES.gift.tiers.map((t) => {
                      const open = giftAfter?.threshold === t.threshold;
                      const wasNow = giftBefore?.threshold === t.threshold;
                      const reached = p.insurance + addTotal >= t.threshold;
                      const status = open && wasNow ? "지금 이 구간" : open ? "추가하면 이 구간" : wasNow ? "구간이 올라가요" : reached ? "지난 구간 · 선택 불가" : "아직 미달성";
                      return (
                        <div
                          key={t.threshold}
                          className="rounded-2xl"
                          style={{ padding: f(14), background: open ? C.orange50 : "#FAF6F1", border: `2px solid ${open ? C.orange200 : C.line}`, opacity: open ? 1 : 0.6 }}
                        >
                          <div className="flex items-center justify-between gap-2" style={{ minWidth: 0 }}>
                            <div className="flex items-center gap-2" style={{ minWidth: 0 }}>
                              {open ? <CheckCircle2 size={f(20)} color={C.orange600} /> : <Circle size={f(20)} color="#B9AFA3" />}
                              <span style={{ fontSize: f(16), fontWeight: 900, color: open ? C.orange700 : C.inkMid }}>{t.label} 구간</span>
                            </div>
                            <span style={{ fontSize: f(13), fontWeight: 800, color: open ? C.orange600 : "#A69C90", whiteSpace: "nowrap" }}>{status}</span>
                          </div>
                          <div className="flex gap-2" style={{ marginTop: f(10), minWidth: 0 }}>
                            {t.options.map((opt) => (
                              <button
                                key={opt}
                                type="button"
                                disabled={!open}
                                onClick={() => setGiftPick(opt)}
                                className="rounded-xl transition-colors"
                                style={{
                                  flex: 1,
                                  minWidth: 0,
                                  padding: `${f(12)}px ${f(6)}px`,
                                  minHeight: f(54),
                                  fontSize: f(14.5),
                                  fontWeight: 800,
                                  background: open && giftPick === opt ? C.orange600 : "#fff",
                                  color: open && giftPick === opt ? "#fff" : open ? C.ink : "#A69C90",
                                  border: `2px solid ${open && giftPick === opt ? C.orange600 : C.line}`,
                                }}
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </Card>

                {/* 규칙 */}
                <div style={{ marginTop: f(14) }}>
                  <button onClick={() => setRulesOpen((v) => !v)} className="w-full flex items-center justify-between rounded-2xl" style={{ padding: f(18), minHeight: f(60), background: "#fff", border: `1px solid ${C.line}` }}>
                    <span style={{ fontSize: f(17), fontWeight: 800, color: C.ink }}>시상 규칙 자세히 보기</span>
                    <ChevronDown size={f(24)} color={C.inkMid} style={{ transform: rulesOpen ? "rotate(180deg)" : "none", transition: "transform 200ms" }} />
                  </button>
                  {rulesOpen && (
                    <div className="rounded-2xl" style={{ marginTop: f(8), padding: f(18), background: "#fff", border: `1px solid ${C.line}` }}>
                      <RuleBlock title="시상 1 · 인보험 기본시상" items={[AWARD_RULES.insuranceBase.scope + " · 구간 10/20/30/40/50/60/70/100만원", "누적이 아니라 지금 해당하는 구간 하나만 지급 (예: 30만원 구간 60%면 18만원)", `하이캡 ${HC20T}배수 이상은 해당 구간 금액을 100% 지급 (예: 30만원 구간이면 30만원)`]} />
                      <RuleBlock title="시상 2 · 비암치 추가시상" items={[AWARD_RULES.bial.scope, "실적 2만원 → 2만원", "실적 5만원 → 5만원", "실적 10만원 → 10만원"]} />
                      <RuleBlock title="시상 3 · 3주차 사은품 선택" items={[AWARD_RULES.gift.scope, "10만원 구간 · 홍삼활기력 세트 또는 골드바 0.1g", "20만원 구간 · 에어프라이어 또는 골드바 0.2g", "30만원 구간 · 테팔 무선청소기 또는 골드바 0.3g"]} />
                      <RuleBlock
                        title="시상 4 · 브릿지 시상 (2차년도 지급)"
                        items={[AWARD_RULES.bridge.scope, "10만원 → 익월 50만원 도전", "20만원 → 익월 100만원 도전", "30만원 → 익월 150만원 도전", "익월 1~2주차에 같은 조건 10만원 이상을 다시 채워야 실지급"]}
                        note={`시상 기간 ${BRIDGE_PERIOD} · 다른 시상과 기간이 달라요`}
                      />
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-center gap-2" style={{ marginTop: f(18) }}>
                  <MascotGuide size={f(40)} happy />
                  <p style={{ fontSize: f(13.5), color: "#9E948A", fontWeight: 700, lineHeight: 1.6 }}>
                    {DAILY_DATA.asOfLabel} 자료예요<br />실제 지급액은 최종 정산 기준에 따라 달라질 수 있어요
                    {LAST_UPDATED && <><br />최종 업데이트 {LAST_UPDATED}</>}
                  </p>
                </div>
              </>
            )}
          </main>
        </div>
      </div>
    </ScaleCtx.Provider>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GyeonginiApp />);
</script>
